<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post-Match — Spielberichte</title>

<!-- Aussehen des Reports. Einzige Quelle ist skripte/report.css; build_app.py
     setzt sie hier ein. Nicht in dieser Datei bearbeiten. -->
<style id="report-css">
/* Gemeinsames Aussehen von Druckreport und App. Einzige Quelle: report.py setzt
   die Datei in die erzeugte Seite ein, build_app.py in app.html. Nicht in der
   erzeugten Datei bearbeiten - Aenderungen gehoeren hierher. */
/* Palette. Nur --klub und --klub-kontrast kommen aus dem Klubprofil und werden
   von der erzeugenden Seite ueberschrieben; alles andere ist Produktfarbe. */
:root{
  --ink:#141412;--ink2:#4d4c48;--muted:#84827b;--line:rgba(20,20,18,.15);
  --track:#e6e5df;--karte:#fbfbf9;--band:#f1f0ec;--gut:#286c47;--schlecht:#a83b2a;
  --klub:#1b3a5c;--klub-kontrast:#ffffff;
}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font:9.6pt/1.42 -apple-system,"Segoe UI",system-ui,Helvetica,Arial,sans-serif;
  color:var(--ink);background:#fff}
h2{font-size:11pt;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:8.6pt;margin:0 0 5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
h4{font-size:9pt;margin:0 0 3px}
p{margin:0}
table{border-collapse:collapse;width:100%}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.seite{background:#fff}
@media screen{
  body{background:#e8e7e2;padding:22px 0}
  .seite{width:210mm;min-height:297mm;margin:0 auto 20px;padding:11mm 12mm;
    box-shadow:0 2px 16px rgba(0,0,0,.15)}
}
@media print{
  .seite{width:auto;min-height:0;padding:0;box-shadow:none;break-after:page}
  .seite:last-child{break-after:auto}
}

.kopf{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:2px solid var(--klub);padding-bottom:6px;margin-bottom:9px}
.marke{display:flex;gap:9px;align-items:center}
.badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
  background:var(--klub);color:var(--klub-kontrast);font-weight:700;font-size:9.5pt;
  letter-spacing:.02em;border-radius:4px}
.klub{font-weight:700;font-size:12pt;letter-spacing:-.015em;line-height:1.15}
.doktyp{font-size:8.4pt;color:var(--ink2);text-transform:uppercase;letter-spacing:.1em}
.kopf-rechts{text-align:right;font-size:8.6pt;color:var(--ink2);line-height:1.45}
.kopf-rechts b{color:var(--ink);font-size:9.4pt}

.ergebnis{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  margin:0 0 9px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.teams{font-size:15.5pt;letter-spacing:-.02em;font-weight:600;white-space:nowrap}
.punkte{font-size:15.5pt;font-weight:700;line-height:1;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.punkte span{font-size:8.4pt;font-weight:400;color:var(--muted);margin-left:5px}
.teams .tore{margin:0 11px;padding:1px 9px;background:var(--klub);color:var(--klub-kontrast);
  border-radius:4px;font-variant-numeric:tabular-nums}
.teams .geg{font-weight:400;color:var(--ink2)}
.ort{font-size:8.6pt;color:var(--muted)}

.ebenen{display:grid;grid-template-columns:1.32fr 1fr;gap:8px;align-items:stretch}
.rechts{display:grid;gap:8px}
.karte{border:1px solid var(--line);border-radius:5px;padding:8px 9px 9px;background:var(--karte);
  display:flex;flex-direction:column}
.karte .fuss{margin-top:auto;padding-top:5px}
.kopfzeile{font-weight:700;font-size:9.4pt;margin-bottom:6px;display:flex;
  align-items:baseline;gap:6px;flex-wrap:wrap}
.stufe{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
  background:var(--klub);color:var(--klub-kontrast);border-radius:3px;font-size:8pt}
.frage{font-weight:400;font-size:8.2pt;color:var(--muted)}
.kennzahl{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.kennzahl .wert{font-size:26pt;line-height:1;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.kennzahl.klein .wert{font-size:19pt}
.kennzahl .von{font-size:8.4pt;color:var(--ink2)}
.kennzahl .neben{flex-basis:100%;font-size:8.2pt;color:var(--muted);margin-top:2px}
.fuss{font-size:7.7pt;line-height:1.35;color:var(--muted);margin-top:6px}
.leerkarte{font-size:9pt;color:var(--ink2);padding:8px 0 10px}
.leerkarte span{display:block;font-size:8.2pt;color:var(--muted);margin-top:3px}

.urteil{display:inline-block;font-size:8.4pt;font-weight:600;padding:2px 7px;border-radius:3px;
  margin-bottom:5px}
.urteil.gut{background:#e3f0e8;color:var(--gut)}
.urteil.schlecht{background:#f7e6e2;color:var(--schlecht)}
.urteil.neutral{background:#ecebe5;color:var(--ink2)}

.bar{position:relative;height:5px;background:var(--track);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--klub);border-radius:3px}
.bar.duenn{height:4px}
.bar .tick{position:absolute;left:50%;top:0;width:1px;height:100%;background:rgba(0,0,0,.30)}
.bar.leer{background:repeating-linear-gradient(90deg,var(--track) 0 3px,#fff 3px 6px)}
.bz{width:38%;padding:0 8px}

.phasen th{text-align:left;font-weight:400;padding:2.6px 0;white-space:nowrap}
.phasen .gew{color:var(--muted);font-size:7.8pt;margin-left:5px}
.phasen .pfrage{font-size:7.6pt;color:var(--muted);font-weight:400;white-space:normal;
  max-width:52mm;line-height:1.3;margin-top:1px}
.phasen th{vertical-align:top;padding-right:6px}
.phasen td{padding:2.6px 0;vertical-align:top}
.phasen .bz{padding-top:5px}
.phasen .num{padding-top:0}
.spark{width:100%;height:28px;display:block;margin:0 0 4px}
.spark .pfad{fill:none;stroke:var(--klub);stroke-width:1.4;stroke-linejoin:round}
.spark .mid{stroke:rgba(0,0,0,.18);stroke-width:.8;stroke-dasharray:3 3}
.spark .jetzt{fill:var(--klub);stroke:#fff;stroke-width:1.4}

.ziel th{text-align:left;font-weight:400;padding:2.2px 0}
.ziel .soll{text-align:right;color:var(--muted);font-size:8pt;white-space:nowrap}
.pbar{display:flex;height:15px;border-radius:3px;overflow:hidden;margin:5px 0 2px;
  font-size:7.4pt;color:#fff;line-height:15px;text-align:center}
.pbar .p0{background:var(--klub)}
.pbar .p1{background:#9b9992}
.pbar .p2{background:#3f3e3a}
.plabels{display:flex;font-size:7.4pt;color:var(--muted)}
.plabels span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plabels span:nth-child(2){text-align:center}
.plabels span:last-child{text-align:right}
.ziel .zweit{text-align:right;font-weight:400;color:var(--ink2);padding-left:10px}

.paar{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:9px}
.kpiliste{list-style:none;margin:0;padding:0}
.kpiliste li{margin-bottom:5px}
.kz{display:flex;align-items:baseline;gap:6px;margin-bottom:2px}
.kurz{display:inline-block;min-width:20px;font-size:7.4pt;font-weight:700;color:var(--klub);
  letter-spacing:.04em}
.kname{font-weight:600}
.kz .num{margin-left:auto;font-weight:700}
.mgmt{font-size:8pt;color:var(--muted);margin-top:2px}

.kontextblock{margin-top:9px}
.kontextspalten{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px;font-size:8pt}
.kontext td,.kontext th{border-bottom:1px solid var(--line);padding:2.2px 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kontext th{max-width:33mm}
.kontext .perz{width:9mm;color:var(--muted);font-size:7.4pt}
.hinweise{margin-top:8px;border-top:1px solid var(--line);padding-top:6px;
  font-size:7.9pt;line-height:1.35;color:var(--schlecht)}
.hinweise b{color:var(--ink2)}
.profilhinweise{margin:5px 0 0;padding-left:13px;font-size:7.8pt;color:var(--muted)}

.block{margin-bottom:13px}
.kpispalten{column-count:2;column-gap:16px}
.gruppe{break-inside:avoid;margin-bottom:9px}
.gkopf{background:var(--band);font-weight:700;font-size:8.6pt;padding:3px 6px;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.gkopf span{font-weight:400;color:var(--ink2);font-size:7.6pt;white-space:nowrap}
.kpiz{margin-bottom:6px}
.kpiz .def{font-size:7.4pt;line-height:1.3;color:var(--muted);margin-top:2px}
.kpiz .def b{color:var(--ink2);font-weight:600}
.kontext th{text-align:left;font-weight:400}
.warn{color:var(--schlecht);font-weight:700}

.methode .spalten{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:8.2pt;
  color:var(--ink2)}
.seitenfuss{margin-top:auto;padding-top:6px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;font-size:7.6pt;color:var(--muted)}
.seite{display:flex;flex-direction:column}
</style>

<style>
/* Oberflaeche der App. Der Report darunter bringt sein eigenes Aussehen mit;
   hier steht nur das Drumherum — und es verschwindet im Druck vollstaendig. */
:root{--app-bg:#eceae5;--app-flaeche:#fff;--app-linie:rgba(20,20,18,.13)}
@page{size:A4;margin:11mm 12mm 10mm}

@media screen{
  body{background:var(--app-bg);padding:0}
  .app{display:grid;grid-template-columns:308px 1fr;grid-template-rows:auto 1fr;
    grid-template-areas:"kopf kopf" "rail buehne";min-height:100vh}
}
.chrome{font:14px/1.5 -apple-system,"Segoe UI",system-ui,Helvetica,Arial,sans-serif}

.topbar{grid-area:kopf;display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:var(--app-flaeche);border-bottom:1px solid var(--app-linie);
  position:sticky;top:0;z-index:5}
.wortmarke{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;
  letter-spacing:-.01em}
.wortmarke .punkt{width:22px;height:22px;border-radius:5px;background:var(--klub);
  color:var(--klub-kontrast);display:grid;place-items:center;font-size:9px;font-weight:700}
.topbar .rest{margin-left:auto;display:flex;align-items:center;gap:10px}
select,button{font:inherit;color:var(--ink);background:var(--app-flaeche);
  border:1px solid var(--app-linie);border-radius:7px;padding:6px 10px;cursor:pointer}
select:hover,button:hover{border-color:var(--muted)}
button.haupt{background:var(--klub);color:var(--klub-kontrast);border-color:transparent;
  font-weight:600}
.tasten{display:flex;gap:4px}
.tasten button{padding:6px 11px;font-variant-numeric:tabular-nums}
.tasten button[disabled]{opacity:.4;cursor:default}

.rail{grid-area:rail;background:var(--app-flaeche);border-right:1px solid var(--app-linie);
  display:flex;flex-direction:column;max-height:calc(100vh - 44px);position:sticky;top:44px}
.railkopf{padding:12px 14px 10px;border-bottom:1px solid var(--app-linie)}
.railkopf select{width:100%}
.saisonstreifen{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:11px;
  font-size:12px}
.saisonstreifen div{display:flex;justify-content:space-between;gap:6px;
  border-bottom:1px solid var(--app-linie);padding-bottom:3px}
.saisonstreifen b{font-variant-numeric:tabular-nums;font-weight:600}
.saisonstreifen span{color:var(--muted)}

.liste{overflow-y:auto;padding:6px 0 14px}
.zeile{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:baseline;
  width:100%;text-align:left;border:0;border-radius:0;background:none;
  padding:7px 14px;border-bottom:1px solid var(--app-linie);font-size:13px}
.zeile:hover{background:#f6f5f2;border-color:var(--app-linie)}
.zeile[aria-current="true"]{background:var(--band);box-shadow:inset 3px 0 0 var(--klub)}
.zeile .gw{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.zeile .geg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile .ort{color:var(--muted);font-size:11px;margin-left:4px}
.zeile .rechts{display:flex;align-items:baseline;gap:9px;font-variant-numeric:tabular-nums}
.zeile .erg{font-weight:600}
.zeile .stil{width:30px;text-align:right;color:var(--ink2)}
.zeile .ziel{width:11px;text-align:center;font-weight:700}
.zeile .ziel.ja{color:var(--gut)} .zeile .ziel.nein{color:var(--schlecht)}
.zeile .ziel.leer{color:var(--muted);font-weight:400}

.buehne{grid-area:buehne;padding:22px 0;overflow-x:auto}
.hinweisleiste{max-width:210mm;margin:0 auto 14px;padding:0 4px;font-size:12.5px;
  color:var(--muted);display:flex;justify-content:space-between;gap:12px}
.hinweisleiste kbd{font:inherit;background:var(--app-flaeche);border:1px solid var(--app-linie);
  border-bottom-width:2px;border-radius:4px;padding:0 5px}

@media (max-width:900px){
  @media screen{
    .app{grid-template-columns:1fr;grid-template-areas:"kopf" "rail" "buehne"}
    .rail{position:static;max-height:340px;border-right:0;
      border-bottom:1px solid var(--app-linie)}
    .buehne{padding:14px 0}
  }
}
@media print{
  .topbar,.rail,.hinweisleiste{display:none}
  .app{display:block}
  .buehne{padding:0;overflow:visible}
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar chrome">
    <div class="wortmarke"><span class="punkt" id="marke">·</span>Post-Match</div>
    <select id="klubwahl" aria-label="Klub"></select>
    <div class="rest">
      <div class="tasten">
        <button id="vor" title="Vorheriges Spiel (Pfeil links)">←</button>
        <button id="zurueck" title="Nächstes Spiel (Pfeil rechts)">→</button>
      </div>
      <button class="haupt" id="drucken">Drucken / PDF</button>
    </div>
  </header>

  <aside class="rail chrome">
    <div class="railkopf">
      <select id="saisonwahl" aria-label="Saison"></select>
      <div class="saisonstreifen" id="streifen"></div>
    </div>
    <div class="liste" id="liste"></div>
  </aside>

  <main class="buehne">
    <div class="hinweisleiste chrome">
      <span>Der Ausdruck ist die Fassung, die der Klub bekommt — zwei Seiten A4.</span>
      <span><kbd>←</kbd> <kbd>→</kbd> Spiel wechseln</span>
    </div>
    <div id="report"></div>
  </main>
</div>

   in Python fuer den Druck und einmal hier fuer die App; skripte/test_frontend.py

const KPI_DOC = Object.fromEntries(MD.doc_kpis.map(k => [k.key, k]));
const CONF_SCHWELLE = MD.conf_schwelle;

function neutral(text){
  for(const [alt, neu] of TEXTE.frage_ersatz) text = text.split(alt).join(neu);
  return text;
}

function spieleVon(profil){
  const t = MD.teams.find(t => t.key === profil.quelle.team_key);
  if(!t) throw new Error("Kein Team " + profil.quelle.team_key);
  return t.spiele;
}

function ebeneA(spiel){
  const phasen = MD.doc_phasen.map(p => {
    const score = spiel.ph[p.key], conf = spiel.ph_conf[p.key];
    return {key:p.key, label:p.label, gewicht:p.gewicht, frage:neutral(p.frage),
            score, conf, guete:spiel.ph_guete[p.key],
            unsicher: score === null || (conf !== null && conf < CONF_SCHWELLE)};
  });
  const einzel = [];
  for(const [key, score] of Object.entries(spiel.kpi)){
    if(score === null) continue;
    const doc = KPI_DOC[key], conf = spiel.kpi_conf[key];
    einzel.push({key, kurz:doc.kurz, name:doc.name, mgmt:doc.mgmt, phase:doc.phase_label,
      score, conf, roh:spiel.kpi_roh[key], n:spiel.kpi_n[key], urteil:doc.urteil,
      normativ:doc.normativ, definition:doc.definition, norm:doc.norm,
      unsicher: conf !== null && conf < CONF_SCHWELLE});
  }
  const sortiert = einzel.slice().sort((a, b) => b.score - a.score);
  return {score:spiel.score, conf:spiel.conf, phasen, kpis:einzel,
    stark: sortiert.slice(0, 3),
    schwach: sortiert.slice(-3).reverse(),
    ohne_daten: phasen.filter(p => p.score === null).map(p => p.label)};
}

function ebeneB(spiel, profil){
  const ziel = profil.ziel || {};
  if(!Object.keys(ziel).length) return null;
  if(ziel.gilt_fuer_liga && !spiel.ls.startsWith(ziel.gilt_fuer_liga)) return null;
  const staerke = (MD.staerke[spiel.ls] || {})[String(spiel.geg_id)];
  const lm = (MD.ligamittel[spiel.ls] || {}).npxg;
  if(!staerke || lm === undefined || spiel.npxg === null || spiel.npxg_geg === null) return null;

  const b = MD.benchmark;
  const ziel_off = b.npxg_erzeugt + (staerke.def - lm);
  const ziel_def = b.npxg_zugelassen + (staerke.off - lm);
  const ist_diff = spiel.npxg - spiel.npxg_geg;
  const ziel_diff = ziel_off - ziel_def;
  return {label: ziel.label || "Zielniveau", kohorte: ziel.kohorte || "",
    npxg:spiel.npxg, npxg_geg:spiel.npxg_geg, ziel_off, ziel_def, ist_diff, ziel_diff,
    delta: ist_diff - ziel_diff, erreicht: ist_diff >= ziel_diff,
    gegner_off:staerke.off, gegner_def:staerke.def, ligamittel:lm,
    anteil_kohorte:b.anteil_ueber_ziel, anteil_liga:b.anteil_ueber_ziel_liga};
}

function ebeneC(spiel){
  const diff = (a, b) => (a === null || b === null) ? null : a - b;
  return {punkte:spiel.pkt, xp:spiel.xp, dpkt:spiel.dpkt,
    psieg:spiel.psieg, premis:spiel.premis, pnied:spiel.pnied, klasse:spiel.klasse,
    npg:spiel.npg, npxg:spiel.npxg, npg_geg:spiel.npg_geg, npxg_geg:spiel.npxg_geg,
    verwertung: diff(spiel.npg, spiel.npxg),
    verwertung_geg: diff(spiel.npg_geg, spiel.npxg_geg),
    tw_effekt: spiel.tw_effekt};
}

function median(werte){
  const w = werte.filter(x => x !== null && x !== undefined).sort((a, b) => a - b);
  if(!w.length) return null;
  const m = Math.floor(w.length / 2);
  return w.length % 2 ? w[m] : (w[m - 1] + w[m]) / 2;
}

function saisonlage(spiele, i, profil){
  const ls = spiele[i].ls;
  const saison = spiele.filter(s => s.ls === ls);
  const bis = saison.filter(s => s.i <= spiele[i].i);
  const scores = bis.map(s => s.score);
  const aktuell = spiele[i].score;
  const besser = scores.filter(s => s !== null && aktuell !== null && s < aktuell).length;
  const ziele = bis.map(s => ebeneB(s, profil)).filter(Boolean);
  const summe = (f) => bis.reduce((a, s) => a + (f(s) === null ? 0 : f(s)), 0);
  return {liga_saison:ls, spiele:bis.length, spiele_saison:saison.length,
    punkte: summe(s => s.pkt), xp: summe(s => s.xp),
    tore: summe(s => s.tore), gegentore: summe(s => s.gt),
    score_median: median(scores),
    score_rang: aktuell === null ? null : scores.length - besser,
    form: median(bis.slice(-5).map(s => s.score)),
    ueber_ziel: ziele.filter(z => z.erreicht).length, ueber_ziel_von: ziele.length,
    verlauf: bis.map(s => ({gw:s.gw, score:s.score, aktuell: s.i === spiele[i].i}))};
}

function kontext(spiel){
  const zeilen = [];
  for(const k of MD.kontext_def){
    const key = k.key;
    const [wert, perz] = key === "blockhoehe"
      ? [spiel.blockhoehe, spiel.blockhoehe_p]
      : [spiel.kontext[key], spiel.kontext_p[key]];
    if(wert === null || wert === undefined) continue;
    const einheit = k.einheit || "";
    zeilen.push({label: TEXTE.kontext_kurz[key] || k.label,
      einheit: einheit === "%" ? "%" : "",
      nachkomma: TEXTE.nachkomma[einheit] ?? 2, wert, perzentil: perz});
  }
  return zeilen;
}

function flaggen(spiel){
  return (spiel.flags || "").split(";").filter(Boolean)
    .map(f => ({key:f, text: TEXTE.flag[f] || f}));
}

function befund(profil, i){
  const spiele = spieleVon(profil);
  const s = spiele[i];
  return {profil, spiel:s, a:ebeneA(s), b:ebeneB(s, profil), c:ebeneC(s),
    saison:saisonlage(spiele, i, profil), kontext:kontext(s), flags:flaggen(s),
    benchmark:MD.benchmark, conf_schwelle:CONF_SCHWELLE};
}

function zahl(x, nd = 1, plus = false){
  if(x === null || x === undefined || Number.isNaN(x)) return "—";
  let s = x.toFixed(nd);
  if(plus && !s.startsWith("-")) s = "+" + s;
  return s.replace("-", "−").replace(".", ",");
}
function prozent(x, nd = 0){ return x === null ? "—" : zahl(x, nd) + " %"; }
function esc(s){
  return String(s === null || s === undefined ? "" : s).replace(
    /[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#x27;"}[c]));
}
function datumDe(iso){ const [j, m, t] = iso.split("-"); return `${t}.${m}.${j}`; }

function balken(score, klasse = ""){
  if(score === null || score === undefined)
    return '<div class="bar leer"><span class="tick"></span></div>';
  const w = Math.max(0, Math.min(100, score)).toFixed(1);
  return `<div class="bar ${klasse}"><i style="width:${w}%"></i><span class="tick"></span></div>`;
}

function sparkline(verlauf){
  const pts = verlauf.filter(v => v.score !== null);
  if(pts.length < 2) return "";
  const w = 320, h = 34, rand = 4, n = pts.length - 1;
  const xy = pts.map((p, i) => [rand + i / n * (w - 2 * rand),
                                rand + (1 - p.score / 100) * (h - 2 * rand)]);
  const linie = xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  const punkt = xy.filter((_, i) => pts[i].aktuell)
    .map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.1" class="jetzt"/>`)
    .join("");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img"
    aria-label="Saisonverlauf der Stiltreue">
    <line x1="0" y1="${h / 2}" x2="${w}" y2="${h / 2}" class="mid"/>
    <polyline points="${linie}" class="pfad"/>${punkt}</svg>`;
}

function wahrscheinlichkeiten(c){
  const teile = [["Sieg", c.psieg], ["Remis", c.premis], ["Niederlage", c.pnied]];
  if(teile.some(([, p]) => p === null)) return "";
  const seg = teile.map(([, p], i) =>
    `<span class="p${i}" style="width:${(p * 100).toFixed(1)}%">${prozent(p * 100)}</span>`).join("");
  const labels = teile.map(([l, p]) =>
    `<span style="width:${(p * 100).toFixed(1)}%">${esc(l)}</span>`).join("");
  return `<div class="pbar">${seg}</div><div class="plabels">${labels}</div>`;
}

function karteA(b){
  const a = b.a, s = b.saison;
  const zeilen = a.phasen.map(p => {
    const marke = p.unsicher ? ' <span class="warn" title="wenige Ereignisse">•</span>' : "";
    return `<tr><th>${esc(p.label)}<span class="gew">${zahl(p.gewicht * 100, 0)} %</span>
      <div class="pfrage">${esc(p.frage)}</div></th>
      <td class="bz">${balken(p.score)}</td>
      <td class="num">${zahl(p.score)}${marke}</td></tr>`;
  }).join("");
  const fehlend = a.ohne_daten.length ? a.ohne_daten.join(", ") : "keine";
  return `
<section class="karte gross-links">
  <div class="kopfzeile"><span class="stufe">A</span> Spielstiltreue
    <span class="frage">Wie nah kam das Spiel der Spielidee?</span></div>
  <div class="kennzahl"><span class="wert">${zahl(a.score)}</span><span class="von">/ 100</span>
    <div class="neben">Saison-Median ${zahl(s.score_median)} ·
      Rang ${s.score_rang ?? "—"} von ${s.spiele} ·
      Form (letzte 5) ${zahl(s.form)}</div></div>
  ${sparkline(s.verlauf)}
  <table class="phasen"><tbody>${zeilen}</tbody></table>
  <div class="fuss">Belastbarkeit dieses Spiels ${zahl(a.conf, 2)} ·
    Phasen ohne Daten: ${esc(fehlend)} · Der Wert misst Identität, nicht Qualität.</div>
</section>`;
}

function karteB(b){
  const e = b.b;
  if(e === null){
    const grund = (b.profil.hinweise || [])[0]
      || "Für dieses Profil ist keine Zielreferenz hinterlegt.";
    return `
<section class="karte">
  <div class="kopfzeile"><span class="stufe">B</span> Aufstiegsperformance
    <span class="frage">Hätte das für den Aufstieg gereicht?</span></div>
  <div class="leerkarte">Nicht anwendbar.<br><span>${esc(grund)}</span></div>
</section>`;
  }
  const urteil = e.erreicht ? "gut" : "schlecht";
  const text = e.erreicht ? "Zielmarke erreicht" : "Zielmarke verfehlt";
  const anteil = e.anteil_kohorte.toFixed(0).replace(".", ",") + " %";
  return `
<section class="karte">
  <div class="kopfzeile"><span class="stufe">B</span> Aufstiegsperformance
    <span class="frage">Hätte das gegen diesen Gegner gereicht?</span></div>
  <div class="urteil ${urteil}">${text}</div>
  <div class="kennzahl klein"><span class="wert">${zahl(e.delta, 2, true)}</span>
    <span class="von">npxG-Differenz gegenüber dem Ziel</span></div>
  <table class="ziel"><tbody>
    <tr><th>npxG erzeugt</th><td class="num">${zahl(e.npxg, 2)}</td>
        <td class="soll">Ziel ${zahl(e.ziel_off, 2)}</td></tr>
    <tr><th>npxG zugelassen</th><td class="num">${zahl(e.npxg_geg, 2)}</td>
        <td class="soll">Ziel ${zahl(e.ziel_def, 2)}</td></tr>
  </tbody></table>
  <div class="fuss">Ziel = Mittel der ${esc(e.kohorte)}, an die Stärke dieses Gegners
    angepasst. Saison: ${b.saison.ueber_ziel} von ${b.saison.ueber_ziel_von} Spielen
    über Ziel — Aufsteiger selbst schaffen ${anteil}.</div>
</section>`;
}

function karteC(b){
  const c = b.c, d = c.dpkt || 0;
  const urteil = d > 0.4 ? "gut" : (d < -0.4 ? "schlecht" : "neutral");
  return `
<section class="karte">
  <div class="kopfzeile"><span class="stufe">C</span> Outcome Alignment
    <span class="frage">Passt das Ergebnis zur Leistung?</span></div>
  <div class="kennzahl klein"><span class="wert">${c.punkte}</span>
    <span class="von">Punkte gegen ${zahl(c.xp, 2)} xPoints</span></div>
  <div class="urteil ${urteil}">${zahl(c.dpkt, 2, true)} · ${esc(c.klasse)}</div>
  ${wahrscheinlichkeiten(c)}
  <table class="ziel"><tbody>
    <tr><th>Verwertung eigen</th><td class="num">${zahl(c.verwertung, 2, true)}</td>
        <th class="zweit">Gegner</th><td class="num">${zahl(c.verwertung_geg, 2, true)}</td></tr>
    <tr><th>Torhüter-Effekt</th><td class="num">${zahl(c.tw_effekt, 2, true)}</td>
        <td colspan="2" class="soll">xG Save − Gegentore</td></tr>
  </tbody></table>
  <div class="fuss">Verwertung = Tore ohne Elfmeter minus npxG.</div>
</section>`;
}

function kpiKachel(k){
  const zusatz = k.unsicher ? ' <span class="warn">•</span>' : "";
  return `<li><div class="kz"><span class="kurz">${esc(k.kurz)}</span>
    <span class="kname">${esc(k.name)}</span>
    <span class="num">${zahl(k.score)}${zusatz}</span></div>
    ${balken(k.score)}<div class="mgmt">${esc(k.mgmt)}</div></li>`;
}

function starkSchwach(b){
  return `
<section class="paar">
  <div><h3>Am nächsten an der Spielidee</h3>
    <ul class="kpiliste">${b.a.stark.map(kpiKachel).join("")}</ul></div>
  <div><h3>Am weitesten weg</h3>
    <ul class="kpiliste">${b.a.schwach.map(kpiKachel).join("")}</ul></div>
</section>`;
}

function hinweise(b){
  if(!b.flags.length) return "";
  const text = b.flags.map(f => esc(f.text)).join(" · ");
  return `<section class="hinweise"><b>Zu diesem Spiel:</b> ${text}</section>`;
}

function kpiTabelle(b){
  const nachPhase = {};
  for(const k of b.a.kpis) (nachPhase[k.phase] = nachPhase[k.phase] || []).push(k);
  const gruppen = b.a.phasen.map(p => {
    const eintraege = nachPhase[p.label] || [];
    const kopf = `<div class="gkopf">${esc(p.label)}<span>${
      eintraege.length ? "Phasenscore " + zahl(p.score) : "keine Daten"
      } · Gewicht ${zahl(p.gewicht * 100, 0)} %</span></div>`;
    const zeilen = eintraege.map(k => {
      const marke = k.unsicher ? ' <span class="warn">•</span>' : "";
      return `<div class="kpiz">
        <div class="kz"><span class="kurz">${esc(k.kurz)}</span>
        <span class="kname">${esc(k.name)}</span>
        <span class="num">${zahl(k.score)}${marke}</span></div>
        ${balken(k.score)}
        <div class="def">${esc(k.definition)} · <b>${zahl(k.roh, 3)}</b> ${esc(k.norm)} ·
        n = ${zahl(k.n, 0)} · Trennschärfe ${esc(TEXTE.urteil_kurz[k.urteil] || k.urteil)}</div>
        </div>`;
    }).join("");
    return `<section class="gruppe">${kopf}${zeilen}</section>`;
  }).join("");
  return `
<section class="block">
  <h2>Die 15 KPIs im Einzelnen</h2>
  <div class="kpispalten">${gruppen}</div>
  <div class="fuss">Score 50 = Median der Liga-Saison, 100 = P90 der Referenzkohorte; der Strich
    im Balken markiert die 50. <span class="warn">•</span> steht für wenige Ereignisse
    (Belastbarkeit unter ${zahl(b.conf_schwelle, 2)}). Die Trennschärfe sagt, wie deutlich der
    KPI die vier Referenzmannschaften vom Ligamittel trennt — eine Eigenschaft des KPIs, nicht
    dieses Spiels.</div>
</section>`;
}

function kontextTabelle(b){
  const zeilen = b.kontext.map(z => {
    const einheit = z.einheit === "%" ? " %" : "";
    return `<tr><th>${esc(z.label)}</th>
      <td class="num">${zahl(z.wert, z.nachkomma)}${einheit}</td>
      <td class="num perz">P${zahl(z.perzentil, 0)}</td></tr>`;
  });
  const je = Math.ceil(zeilen.length / 3);
  const bloecke = [];
  for(let i = 0; i < zeilen.length; i += je) bloecke.push(zeilen.slice(i, i + je));
  const spalten = bloecke.map(t => `<table class="kontext"><tbody>${t.join("")}</tbody></table>`)
    .join("");
  return `
<section class="block kontextblock">
  <h3>Spielkontext — was der Gegner getan und zugelassen hat</h3>
  <div class="kontextspalten">${spalten}</div>
  <div class="fuss">P = Perzentil in der Liga-Saison (P50 = Ligamitte). Hoher PPDA-Wert = der
    Gegner läuft nicht an; negative Blockhöhe = er stand tiefer als üblich.</div>
</section>`;
}

function profilhinweise(p){
  const hs = p.hinweise || [];
  if(!hs.length) return "";
  return '<ul class="profilhinweise">' + hs.map(h => `<li>${esc(h)}</li>`).join("") + "</ul>";
}

function methode(b){
  const p = b.profil;
  return `
<section class="block methode">
  <h2>Wie zu lesen</h2>
  <div class="spalten">
    <div><h4>Drei Fragen, getrennt gehalten</h4>
      <p><b>A</b> misst Identität: wie nah das Spiel der hinterlegten Spielidee kam.
      Ein hoher Wert ist keine Aussage über Qualität. <b>B</b> misst Niveau gegen die
      Aufstiegsreferenz, gegnerbereinigt. <b>C</b> prüft, ob das Ergebnis zur Leistung passt.
      Die drei Werte werden bewusst nicht zu einer Note verrechnet.</p></div>
    <div><h4>Was der Rahmen nicht kann</h4>
      <p>Der Flügelfokus hat keine Vorbild-Evidenz — sein Korridor ist normativ auf das obere
      Ligafünftel gesetzt. Die Umschalt-KPIs trennen schwach: ohne Event-Daten mit Zeitstempeln
      lässt sich kein Umschaltmoment isolieren, gemessen wird die Spielsumme je Ballgewinn.</p></div>
    <div><h4>Grundlage</h4>
      <p>Spielidee: ${esc(p.spielidee)}. KPI-Set „${esc(p.kpi_set || "—")}“,
      z-standardisiert je Liga-Saison über 4.343 Spiele aus 16 Liga-Saisons.
      Alle Werte sind gerechnet, nicht geschätzt.</p>
      ${profilhinweise(p)}</div>
  </div>
</section>`;
}

function seiten(b){
  const p = b.profil, s = b.spiel;
  const ort = s.heim ? "Heimspiel" : "Auswärtsspiel";
  const fuss = `${esc(p.kurz)} · ${esc(s.ls)} · ${s.gw}. Spieltag · ${datumDe(s.datum)}`;
  return `
<div class="seite">
  <header class="kopf">
    <div class="marke"><span class="badge">${esc(p.kuerzel)}</span>
      <div><div class="klub">${esc(p.name)}</div>
        <div class="doktyp">Post-Match-Report</div></div></div>
    <div class="kopf-rechts"><b>${esc(s.ls)} · ${s.gw}. Spieltag</b><br>
      ${datumDe(s.datum)} · ${ort}</div>
  </header>
  <section class="ergebnis">
    <div>
      <div class="teams"><span>${esc(p.kurz)}</span>
        <span class="tore">${s.tore} : ${s.gt}</span>
        <span class="geg">${esc(s.geg)}</span></div>
      <div class="ort">Spielidee: ${esc(p.spielidee)}</div>
    </div>
    <div class="punkte">${s.pkt}<span>${s.pkt === 1 ? "Punkt" : "Punkte"}</span></div>
  </section>
  <div class="ebenen">
    ${karteA(b)}
    <div class="rechts">${karteB(b)}${karteC(b)}</div>
  </div>
  ${starkSchwach(b)}
  ${kontextTabelle(b)}
  ${hinweise(b)}
  <div class="seitenfuss"><span>${fuss}</span><span>Seite 1 von 2</span></div>
</div>
<div class="seite">
  ${kpiTabelle(b)}
  ${methode(b)}
  <div class="seitenfuss"><span>${fuss}</span><span>Seite 2 von 2</span></div>
</div>`;
}

/* ==========================================================================
   Oberflaeche
   ========================================================================== */
const el = (id) => document.getElementById(id);
const zustand = {profil:null, index:0, saison:null};

function profilVon(slug){ return KLUBS.find(k => k.slug === slug) || KLUBS[0]; }

function saisonsVon(profil){
  return [...new Set(spieleVon(profil).map(s => s.ls))];
}

function setzeKlubfarbe(profil){
  const w = document.documentElement.style;
  w.setProperty("--klub", profil.farbe);
  w.setProperty("--klub-kontrast", profil.farbe_kontrast || "#ffffff");
  el("marke").textContent = profil.kuerzel;
  document.title = `${profil.kurz} — Post-Match`;
}

function zeichneKlubwahl(){
  el("klubwahl").innerHTML = KLUBS.map(k =>
    `<option value="${esc(k.slug)}">${esc(k.name)}</option>`).join("");
  el("klubwahl").value = zustand.profil.slug;
}

function zeichneSaisonwahl(){
  const saisons = saisonsVon(zustand.profil);
  el("saisonwahl").innerHTML = saisons.map(s =>
    `<option value="${esc(s)}">${esc(s)}</option>`).join("");
  el("saisonwahl").value = zustand.saison;
  el("saisonwahl").disabled = saisons.length < 2;
}

function zeichneStreifen(b){
  const s = b.saison;
  const felder = [
    ["Punkte", `${s.punkte} <span>/ ${zahl(s.xp, 1)} xP</span>`],
    ["Tore", `${s.tore}:${s.gegentore}`],
    ["Stiltreue Median", zahl(s.score_median)],
    ["Spiele", `${s.spiele} <span>/ ${s.spiele_saison}</span>`],
  ];
  if(s.ueber_ziel_von)
    felder.push(["Über Ziel", `${s.ueber_ziel} <span>/ ${s.ueber_ziel_von}</span>`]);
  el("streifen").innerHTML = felder.map(([k, v]) =>
    `<div><span>${k}</span><b>${v}</b></div>`).join("");
}

function zeichneListe(){
  const spiele = spieleVon(zustand.profil);
  const zeilen = spiele.map((s, i) => {
    if(s.ls !== zustand.saison) return "";
    const e = ebeneB(s, zustand.profil);
    const ziel = e === null ? '<span class="ziel leer">–</span>'
      : `<span class="ziel ${e.erreicht ? "ja" : "nein"}">${e.erreicht ? "✓" : "✗"}</span>`;
    return `<button class="zeile" data-i="${i}" aria-current="${i === zustand.index}">
      <span class="gw">${s.gw}.</span>
      <span class="geg">${esc(s.geg)}<span class="ort">${s.heim ? "H" : "A"}</span></span>
      <span class="rechts"><span class="erg">${s.tore}:${s.gt}</span>
        <span class="stil">${zahl(s.score)}</span>${ziel}</span></button>`;
  }).join("");
  const liste = el("liste");
  liste.innerHTML = zeilen;
  liste.querySelectorAll(".zeile").forEach(z =>
    z.addEventListener("click", () => waehle(zustand.profil.slug, +z.dataset.i)));
  const aktiv = liste.querySelector('[aria-current="true"]');
  if(aktiv) aktiv.scrollIntoView({block:"nearest"});
}

function nachbar(schritt){
  const spiele = spieleVon(zustand.profil);
  let i = zustand.index + schritt;
  while(i >= 0 && i < spiele.length && spiele[i].ls !== zustand.saison) i += schritt;
  return (i >= 0 && i < spiele.length) ? i : null;
}

function zeichne(){
  const b = befund(zustand.profil, zustand.index);
  setzeKlubfarbe(zustand.profil);
  el("report").innerHTML = seiten(b);
  zeichneStreifen(b);
  zeichneListe();
  el("vor").disabled = nachbar(-1) === null;
  el("zurueck").disabled = nachbar(1) === null;
}

function waehle(slug, index, opt = {}){
  const profil = profilVon(slug);
  const spiele = spieleVon(profil);
  if(index === null || index === undefined || index < 0 || index >= spiele.length)
    index = spiele.length - 1;
  zustand.profil = profil;
  zustand.index = index;
  zustand.saison = spiele[index].ls;
  zeichneKlubwahl();
  zeichneSaisonwahl();
  zeichne();
  if(!opt.ausHash) location.hash = `klub=${slug}&spiel=${index}`;
  window.scrollTo({top:0});
}

function ausHash(){
  const p = new URLSearchParams(location.hash.replace(/^#/, ""));
  const slug = p.get("klub");
  const i = p.get("spiel");
  waehle(slug && profilVon(slug).slug === slug ? slug : KLUBS[0].slug,
         i === null ? null : +i, {ausHash:true});
}

el("klubwahl").addEventListener("change", (e) => waehle(e.target.value, null));
el("saisonwahl").addEventListener("change", (e) => {
  zustand.saison = e.target.value;
  const erstes = spieleVon(zustand.profil).findIndex(s => s.ls === zustand.saison);
  waehle(zustand.profil.slug, erstes);
});
el("vor").addEventListener("click", () => {
  const i = nachbar(-1); if(i !== null) waehle(zustand.profil.slug, i);
});
el("zurueck").addEventListener("click", () => {
  const i = nachbar(1); if(i !== null) waehle(zustand.profil.slug, i);
});
el("drucken").addEventListener("click", () => window.print());
document.addEventListener("keydown", (e) => {
  if(e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey) return;
  const schritt = e.key === "ArrowLeft" ? -1 : (e.key === "ArrowRight" ? 1 : 0);
  if(!schritt) return;
  const i = nachbar(schritt);
  if(i !== null) waehle(zustand.profil.slug, i);
});
window.addEventListener("hashchange", ausHash);

/* Fuer skripte/test_frontend.py: dieselbe Rechnung, von aussen aufrufbar. */
window.APP = {befund, spieleVon, profile: () => KLUBS};

if(KLUBS.length) ausHash();
</script>
</body>
</html>
